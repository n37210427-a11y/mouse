<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>에어팟 케이스 마우스 패드</title>
    <style>
        body { margin: 0; background: #222; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        #pad { width: 90vw; height: 60vh; background: #333; border: 2px dashed #555; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
        #btn { width: 90vw; height: 15vh; margin-top: 20px; background: #007bff; border: none; border-radius: 20px; color: white; font-size: 1.5rem; font-weight: bold; }
    </style>
</head>
<body>
    <h3>에어팟 마우스 터치패드</h3>
    <div id="pad">여기를 문지르세요</div>
    <button id="btn">클릭</button>

    <script>
        // ⚠️ 주의: localhost 대신 본인 PC의 IPv4 주소를 적어야 스마트폰에서 연결됩니다!
        const PC_IP = "http://192.168.219.113:5000";
        const pad = document.getElementById('pad');
        const btn = document.getElementById('btn');
        
        let lastX = 0, lastY = 0;

        pad.addEventListener('touchstart', (e) => {
            lastX = e.touches[0].clientX;
            lastY = e.touches[0].clientY;
        });

        pad.addEventListener('touchmove', (e) => {
            let currentX = e.touches[0].clientX;
            let currentY = e.touches[0].clientY;

            let deltaX = currentX - lastX;
            let deltaY = currentY - lastY;

            // PC 파이썬 서버로 이동 신호 전송
            fetch(`${PC_IP}/move`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ x: deltaX, y: deltaY })
            });

            lastX = currentX;
            lastY = currentY;
        });

        btn.addEventListener('click', () => {
            fetch(`${PC_IP}/click`, { method: 'POST' });
        });
    </script>
</body>
</html>
