<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>스마트폰 무선 트랙패드</title>
    <style>
        body { 
            margin: 0; background: #1a1a1a; color: white; font-family: sans-serif; 
            display: flex; flex-direction: column; align-items: center; justify-content: space-between; 
            height: 100vh; overflow: hidden; touch-action: none;
            padding: 20px 0;
            box-sizing: border-box;
        }
        h3 {
            margin: 0;
            font-size: 1.2rem;
            color: #aaa;
        }
        /* 트랙패드 영역 */
        #trackpad {
            width: 90vw;
            height: 70vh;
            background: #252525;
            border: 2px solid #444;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.6);
            position: relative;
        }
        #trackpad-text {
            color: #666;
            font-size: 1.1rem;
            pointer-events: none;
        }
        /* 버튼 영역 */
        .btn-container {
            display: flex;
            gap: 15px;
            width: 90vw;
            height: 10vh;
        }
        .btn { 
            flex: 1; height: 100%; 
            background: #ffca28; border: none; border-radius: 15px; 
            color: #1a1a1a; font-size: 1.2rem; font-weight: bold; cursor: pointer; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .btn:active { background: #e6b800; transform: scale(0.98); }
        #right-btn { background: #ff7043; color: white; }
        #right-btn:active { background: #d84315; }
    </style>
</head>
<body>
    <h3>🖱️ 무선 트랙패드 마우스</h3>
    
    <div id="trackpad">
        <div id="trackpad-text">여기를 손가락으로 밀어서 움직이세요</div>
    </div>
    
    <div class="btn-container">
        <button id="left-btn" class="btn">좌클릭</button>
        <button id="right-btn" class="btn">우클릭</button>
    </div>

    <script>
        const FIREBASE_URL = "https://mouse-f7ceb-default-rtdb.asia-southeast1.firebasedatabase.app/mouse_event.json";

        const trackpad = document.getElementById('trackpad');
        const leftBtn = document.getElementById('left-btn');
        const rightBtn = document.getElementById('right-btn');

        let isTracking = false;
        let lastX = 0;
        let lastY = 0;
        
        // 감도 조절 (숫자가 클수록 커서가 빠르게 움직임)
        const SENSITIVITY = 1.5; 

        function sendToFirebase(data) {
            fetch(FIREBASE_URL, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).catch(err => {});
        }

        function startTouch(x, y) {
            isTracking = true;
            lastX = x;
            lastY = y;
        }

        function moveTouch(x, y) {
            if (!isTracking) return;

            // 이전 위치와의 변화량(Delta) 계산
            let dx = (x - lastX) * SENSITIVITY;
            let dy = (y - lastY) * SENSITIVITY;

            lastX = x;
            lastY = y;

            if (Math.abs(dx) > 0 || Math.abs(dy) > 0) {
                sendToFirebase({ 
                    type: 'move', 
                    x: dx, 
                    y: dy, 
                    time: Date.now() 
                });
            }
        }

        function endTouch() {
            if (!isTracking) return;
            isTracking = false;
            sendToFirebase({ type: 'stop', time: Date.now() });
        }

        // 터치 이벤트 연결
        trackpad.addEventListener('touchstart', (e) => {
            startTouch(e.touches[0].clientX, e.touches[0].clientY);
        });
        window.addEventListener('touchmove', (e) => {
            if (isTracking) moveTouch(e.touches[0].clientX, e.touches[0].clientY);
        });
        window.addEventListener('touchend', endTouch);

        // 마우스 드래그 테스트 지원 (PC 브라우저 등에서 테스트할 때)
        trackpad.addEventListener('mousedown', (e) => {
            startTouch(e.clientX, e.clientY);
        });
        window.addEventListener('mousemove', (e) => {
            if (isTracking) moveTouch(e.clientX, e.clientY);
        });
        window.addEventListener('mouseup', endTouch);

        // 클릭 버튼 이벤트
        leftBtn.addEventListener('click', () => {
            sendToFirebase({ type: 'click', time: Date.now() });
        });

        rightBtn.addEventListener('click', () => {
            sendToFirebase({ type: 'rightclick', time: Date.now() });
        });
    </script>
</body>
</html>
