<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>통합 무선 컨트롤러 (반응형)</title>
    <style>
        body { 
            margin: 0; background: #1a1a1a; color: white; font-family: sans-serif; 
            display: flex; flex-direction: column; align-items: center; justify-content: space-between; 
            height: 100vh; overflow: hidden; touch-action: none;
            padding: 10px 0; box-sizing: border-box;
        }
        
        /* 기기별 화면 크기 최적화를 위한 래퍼 (스마트폰 & 아이패드 공용) */
        .wrapper {
            width: 92vw;
            max-width: 650px; /* 아이패드/태블릿에서 너무 넓어지지 않도록 제한 */
            height: 95vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        /* 상단 모드 전환 탭 */
        .mode-tabs {
            display: flex; gap: 10px; width: 100%; height: 6vh; min-height: 40px;
        }
        .tab-btn {
            flex: 1; background: #333; border: 2px solid #555; border-radius: 12px;
            color: #aaa; font-size: 1.1rem; font-weight: bold; cursor: pointer;
        }
        .tab-btn.active {
            background: #ffca28; color: #1a1a1a; border-color: #ffca28;
        }

        /* 컨트롤러 패널 컨테이너 */
        .panel {
            display: none; width: 100%; height: 86vh;
            flex-direction: column; justify-content: space-between; align-items: center;
        }
        .panel.active { display: flex; }

        /* 마우스 패드 영역 (우측 스크롤 포함) */
        #trackpad-container {
            width: 100%; height: 68vh;
            display: flex; gap: 12px;
        }
        #trackpad {
            flex: 4; background: #252525; border: 2px solid #444; border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            user-select: none; box-shadow: inset 0 4px 10px rgba(0,0,0,0.6); position: relative;
        }
        #scroll-area {
            flex: 1; background: #222; border: 2px dashed #444; border-radius: 20px;
            display: flex; align-items: center; justify-content: center; text-align: center;
            color: #888; font-size: 1rem; user-select: none;
        }
        .pad-text { color: #666; font-size: 1.1rem; pointer-events: none; text-align: center; line-height: 1.5; }

        /* 버튼 컨테이너 */
        .btn-container {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
            width: 100%; height: 13vh; min-height: 60px;
        }
        .btn { 
            background: #ffca28; border: none; border-radius: 14px; 
            color: #1a1a1a; font-size: 1.1rem; font-weight: bold; cursor: pointer; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .btn:active { background: #e6b800; transform: scale(0.98); }
        #right-btn { background: #ff7043; color: white; }
        #drag-btn.active { background: #4caf50 !important; color: white; }
        .shortcut-btn { background: #42a5f5; color: white; }

        /* 키보드 모드 스타일 */
        #keyboard-panel {
            justify-content: flex-start; gap: 15px; padding-top: 10px;
        }
        #text-input {
            width: 100%; height: 55px; background: #252525; border: 2px solid #555;
            border-radius: 12px; color: white; font-size: 1.2rem; padding: 0 15px; box-sizing: border-box;
        }
        .kb-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 100%;
        }
        .kb-btn {
            height: 60px; background: #333; border: none; border-radius: 12px;
            color: white; font-size: 1.1rem; font-weight: bold; cursor: pointer;
        }
        .kb-btn:active { background: #555; }

        /* 아이패드(태블릿) 가로 화면 등 넓은 화면 대응 미디어 쿼리 */
        @media (min-width: 768px) {
            .wrapper { max-width: 750px; }
            .pad-text { font-size: 1.3rem; }
            .btn { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <!-- 상단 모드 전환 -->
        <div class="mode-tabs">
            <button class="tab-btn active" onclick="switchMode('mouse')">🖱️ 마우스 모드</button>
            <button class="tab-btn" onclick="switchMode('keyboard')">⌨️ 키보드 모드</button>
        </div>

        <!-- 1. 마우스 모드 패널 -->
        <div id="mouse-panel" class="panel active">
            <div id="trackpad-container">
                <div id="trackpad">
                    <div class="pad-text">트랙패드<br><span style="font-size:0.9rem; color:#555;">(이곳을 밀어서 이동)</span></div>
                </div>
                <div id="scroll-area">
                    ↕️<br>스크롤<br>영역
                </div>
            </div>

            <div class="btn-container">
                <button id="drag-btn" class="btn" onclick="toggleDrag()">드래그</button>
                <button id="left-btn" class="btn" onclick="sendAction('click')">좌클릭</button>
                <button id="right-btn" class="btn" onclick="sendAction('rightclick')">우클릭</button>
                <button class="btn shortcut-btn" onclick="sendHotkey(['ctrl', 'c'])">복사 (Ctrl+C)</button>
                <button class="btn shortcut-btn" onclick="sendHotkey(['ctrl', 'v'])">붙여넣기 (Ctrl+V)</button>
                <button class="btn" onclick="sendHotkey(['ctrl', 'z'])">실행취소</button>
            </div>
        </div>

        <!-- 2. 키보드 모드 패널 -->
        <div id="keyboard-panel" class="panel">
            <input type="text" id="text-input" placeholder="글자 입력 후 전송..." autocomplete="off">
            <button class="kb-btn" style="width:100%; background:#ffca28; color:#1a1a1a;" onclick="sendText()">텍스트 전송 (Enter)</button>
            
            <div class="kb-grid">
                <button class="kb-btn" onclick="sendHotkey(['enter'])">Enter</button>
                <button class="kb-btn" onclick="sendHotkey(['backspace'])">Backspace</button>
                <button class="kb-btn" onclick="sendHotkey(['ctrl', 'a'])">모두 선택 (Ctrl+A)</button>
                <button class="kb-btn" onclick="sendHotkey(['escape'])">ESC</button>
            </div>
        </div>
    </div>

    <script>
        const FIREBASE_URL = "https://mouse-f7ceb-default-rtdb.asia-southeast1.firebasedatabase.app/mouse_event.json";

        function sendToFirebase(data) {
            fetch(FIREBASE_URL, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).catch(err => {});
        }

        function switchMode(mode) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            
            if (mode === 'mouse') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('mouse-panel').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('keyboard-panel').classList.add('active');
            }
        }

        // --- 마우스 이동 및 스크롤 로직 ---
        const trackpad = document.getElementById('trackpad');
        const scrollArea = document.getElementById('scroll-area');

        let isTracking = false, lastX = 0, lastY = 0, accDx = 0, accDy = 0;
        let isScrollTracking = false, lastScrollY = 0;
        const SENSITIVITY = 2.0; 

        function startTouch(x, y) { isTracking = true; lastX = x; lastY = y; accDx = 0; accDy = 0; }
        function moveTouch(x, y) {
            if (!isTracking) return;
            accDx += (x - lastX) * SENSITIVITY;
            accDy += (y - lastY) * SENSITIVITY;
            lastX = x; lastY = y;
        }
        function animationLoop() {
            if (isTracking && (Math.abs(accDx) > 0.1 || Math.abs(accDy) > 0.1)) {
                sendToFirebase({ type: 'move', x: accDx, y: accDy, time: Date.now() });
                accDx = 0; accDy = 0;
            }
            requestAnimationFrame(animationLoop);
        }
        requestAnimationFrame(animationLoop);

        trackpad.addEventListener('touchstart', e => startTouch(e.touches[0].clientX, e.touches[0].clientY));
        window.addEventListener('touchmove', e => { if (isTracking) moveTouch(e.touches[0].clientX, e.touches[0].clientY); });
        window.addEventListener('touchend', () => { if (isTracking) { isTracking = false; sendToFirebase({ type: 'stop', time: Date.now() }); } });

        trackpad.addEventListener('mousedown', e => startTouch(e.clientX, e.clientY));
        window.addEventListener('mousemove', e => { if (isTracking) moveTouch(e.clientX, e.clientY); });
        window.addEventListener('mouseup', () => { if (isTracking) { isTracking = false; sendToFirebase({ type: 'stop', time: Date.now() }); } });

        // 스크롤 영역 터치
        scrollArea.addEventListener('touchstart', e => { isScrollTracking = true; lastScrollY = e.touches[0].clientY; });
        window.addEventListener('touchmove', e => {
            if (!isScrollTracking) return;
            let currentY = e.touches[0].clientY;
            let diff = lastScrollY - currentY; 
            lastScrollY = currentY;
            if (Math.abs(diff) > 2) {
                sendToFirebase({ type: 'scroll', amount: diff * 3, time: Date.now() });
            }
        });
        window.addEventListener('touchend', () => { isScrollTracking = false; });

        // --- 버튼 액션 함수들 ---
        function sendAction(type) {
            sendToFirebase({ type: type, time: Date.now() });
        }

        function sendHotkey(keys) {
            sendToFirebase({ type: 'hotkey', keys: keys, time: Date.now() });
        }

        let isDraggingLocked = false;
        function toggleDrag() {
            isDraggingLocked = !isDraggingLocked;
            const btn = document.getElementById('drag-btn');
            if (isDraggingLocked) {
                btn.classList.add('active');
                btn.innerText = '드래그중';
                sendToFirebase({ type: 'mousedown', time: Date.now() });
            } else {
                btn.classList.remove('active');
                btn.innerText = '드래그';
                sendToFirebase({ type: 'mouseup', time: Date.now() });
            }
        }

        function sendText() {
            const input = document.getElementById('text-input');
            if (input.value) {
                sendToFirebase({ type: 'type_text', text: input.value, time: Date.now() });
                input.value = '';
            }
        }
    </script>
</body>
</html>
