<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>온라인 조이스틱 마우스</title>
    <style>
        body { 
            margin: 0; background: #1a1a1a; color: white; font-family: sans-serif; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; overflow: hidden; touch-action: none; 
        }
        
        /* 조이스틱 배경 판 */
        #joystick-base {
            width: 240px; height: 240px;
            background: #2d2d2d;
            border: 3px dashed #555;
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            margin-bottom: 30px;
        }
        
        /* 손가락으로 움직이는 조이스틱 손잡이 */
        #joystick-handle {
            width: 90px; height: 90px;
            background: #ffca28;
            border-radius: 50%;
            position: absolute;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: transform 0.05s linear;
        }

        #btn { 
            width: 80vw; height: 12vh; 
            background: #ffca28; border: none; border-radius: 15px; 
            color: #1a1a1a; font-size: 1.8rem; font-weight: bold; cursor: pointer; 
        }
        #btn:active { background: #e6b800; }
    </style>
</head>
<body>
    <h3>🕹️ 파이썬 조이스틱 마우스</h3>
    
    <div id="joystick-base">
        <div id="joystick-handle"></div>
    </div>
    
    <button id="btn">클릭</button>

    <script>
        const FIREBASE_URL = "https://mouse-f7ceb-default-rtdb.asia-southeast1.firebasedatabase.app/mouse_event.json";

        const base = document.getElementById('joystick-base');
        const handle = document.getElementById('joystick-handle');
        const btn = document.getElementById('btn');

        let isDragging = false;
        let centerX = 0, centerY = 0;
        let maxRadius = 75; // 스틱이 움직일 수 있는 최대 반경
        let moveInterval = null;
        let currentX = 0, currentY = 0;

        function sendToFirebase(data) {
            fetch(FIREBASE_URL, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).catch(err => console.log("전송 실패"));
        }

        function updateCenter() {
            const rect = base.getBoundingClientRect();
            centerX = rect.left + rect.width / 2;
            centerY = rect.top + rect.height / 2;
        }

        window.addEventListener('resize', updateCenter);
        window.addEventListener('load', updateCenter);

        function startDrag(clientX, clientY) {
            isDragging = true;
            updateCenter();
            moveJoystick(clientX, clientY);

            // 조이스틱을 밀고 있는 동안 지속적으로 좌표 전송 (연속 이동)
            if (!moveInterval) {
                moveInterval = setInterval(() => {
                    if (isDragging && (Math.abs(currentX) > 0.1 || Math.abs(currentY) > 0.1)) {
                        sendToFirebase({ 
                            type: 'move', 
                            x: currentX * 12, // 속도 배수 (필요시 조절)
                            y: currentY * 12, 
                            time: Date.now() 
                        });
                    }
                }, 30);
            }
        }

        function moveJoystick(clientX, clientY) {
            if (!isDragging) return;

            let dx = clientX - centerX;
            let dy = clientY - centerY;
            let distance = Math.sqrt(dx * dx + dy * dy);

            // 원형 테두리를 벗어나지 않도록 제한
            if (distance > maxRadius) {
                dx = (dx / distance) * maxRadius;
                dy = (dy / distance) * maxRadius;
            }

            handle.style.transform = `translate(${dx}px, ${dy}px)`;

            // -1.0 ~ 1.0 사이의 방향 값으로 변환
            currentX = dx / maxRadius;
            currentY = dy / maxRadius;
        }

        function endDrag() {
            if (!isDragging) return;
            isDragging = false;
            
            if (moveInterval) {
                clearInterval(moveInterval);
                moveInterval = null;
            }

            // 손을 떼면 스틱이 제자리로 복귀
            handle.style.transform = `translate(0px, 0px)`;
            currentX = 0;
            currentY = 0;

            sendToFirebase({ type: 'stop', time: Date.now() });
        }

        // 터치 이벤트 연결
        base.addEventListener('touchstart', (e) => { startDrag(e.touches[0].clientX, e.touches[0].clientY); });
        window.addEventListener('touchmove', (e) => { if(isDragging) moveJoystick(e.touches[0].clientX, e.touches[0].clientY); });
        window.addEventListener('touchend', endDrag);

        // 마우스 이벤트 연결 (PC 브라우저 테스트용)
        base.addEventListener('mousedown', (e) => { startDrag(e.clientX, e.clientY); });
        window.addEventListener('mousemove', (e) => { if(isDragging) moveJoystick(e.clientX, e.clientY); });
        window.addEventListener('mouseup', endDrag);

        btn.addEventListener('click', () => {
            sendToFirebase({ type: 'click', time: Date.now() });
        });
    </script>
</body>
</html>
