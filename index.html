<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>마우스</title>
    <style>
        body { 
            margin: 0; background: #1a1a1a; color: white; font-family: sans-serif; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; overflow: hidden; touch-action: none; 
        }
        #joystick-base {
            width: 220px; height: 220px;
            background: #2d2d2d;
            border: 3px dashed #555;
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            margin-bottom: 20px;
        }
        #joystick-handle {
            width: 80px; height: 80px;
            background: #ffca28;
            border-radius: 50%;
            position: absolute;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .btn-container {
            display: flex;
            gap: 10px;
            width: 90vw;
        }
        .btn { 
            flex: 1; height: 10vh; 
            background: #ffca28; border: none; border-radius: 15px; 
            color: #1a1a1a; font-size: 1.5rem; font-weight: bold; cursor: pointer; 
        }
        .btn:active { background: #e6b800; }
        #right-btn { background: #ff7043; color: white; }
        #right-btn:active { background: #d84315; }
    </style>
</head>
<body>
    <h3>조이스틱 마우스</h3>
    
    <div id="joystick-base">
        <div id="joystick-handle"></div>
    </div>
    
    <div class="btn-container">
        <button id="left-btn" class="btn">좌클릭</button>
        <button id="right-btn" class="btn">우클릭</button>
    </div>

    <script>
        const FIREBASE_URL = "https://mouse-f7ceb-default-rtdb.asia-southeast1.firebasedatabase.app/mouse_event.json";

        const base = document.getElementById('joystick-base');
        const handle = document.getElementById('joystick-handle');
        const leftBtn = document.getElementById('left-btn');
        const rightBtn = document.getElementById('right-btn');

        let isDragging = false;
        let centerX = 0, centerY = 0;
        let maxRadius = 70;
        let moveInterval = null;
        let currentX = 0, currentY = 0;

        function sendToFirebase(data) {
            fetch(FIREBASE_URL, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).catch(err => {});
        }

        function updateCenter() {
            const rect = base.getBoundingClientRect();
            centerX = rect.left + rect.width / 2;
            centerY = rect.top + rect.height / 2;
        }

        window.addEventListener('resize', updateCenter);
        window.addEventListener('load', updateCenter);

        function startDrag(clientX, clientY) {
            isDragging = true;
            updateCenter();
            moveJoystick(clientX, clientY);

            if (!moveInterval) {
                // ⚡ 전송 주기를 15ms로 당겨서 반응 속도 극대화
                moveInterval = setInterval(() => {
                    if (isDragging && (Math.abs(currentX) > 0.1 || Math.abs(currentY) > 0.1)) {
                        sendToFirebase({ 
                            type: 'move', 
                            x: currentX * 30, // 이동 속도 배수
                            y: currentY * 30, 
                            time: Date.now() 
                        });
                    }
                }, 15);
            }
        }

        function moveJoystick(clientX, clientY) {
            if (!isDragging) return;
            let dx = clientX - centerX;
            let dy = clientY - centerY;
            let distance = Math.sqrt(dx * dx + dy * dy);

            if (distance > maxRadius) {
                dx = (dx / distance) * maxRadius;
                dy = (dy / distance) * maxRadius;
            }

            handle.style.transform = `translate(${dx}px, ${dy}px)`;
            currentX = dx / maxRadius;
            currentY = dy / maxRadius;
        }

        function endDrag() {
            if (!isDragging) return;
            isDragging = false;
            
            if (moveInterval) {
                clearInterval(moveInterval);
                moveInterval = null;
            }

            handle.style.transform = `translate(0px, 0px)`;
            currentX = 0;
            currentY = 0;

            sendToFirebase({ type: 'stop', time: Date.now() });
        }

        base.addEventListener('touchstart', (e) => { startDrag(e.touches[0].clientX, e.touches[0].clientY); });
        window.addEventListener('touchmove', (e) => { if(isDragging) moveJoystick(e.touches[0].clientX, e.touches[0].clientY); });
        window.addEventListener('touchend', endDrag);

        base.addEventListener('mousedown', (e) => { startDrag(e.clientX, e.clientY); });
        window.addEventListener('mousemove', (e) => { if(isDragging) moveJoystick(e.clientX, e.clientY); });
        window.addEventListener('mouseup', endDrag);

        leftBtn.addEventListener('click', () => {
            sendToFirebase({ type: 'click', time: Date.now() });
        });

        rightBtn.addEventListener('click', () => {
            sendToFirebase({ type: 'rightclick', time: Date.now() });
        });
    </script>
</body>
</html>
